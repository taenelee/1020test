<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 날씨</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      transition: background 1s ease;
    }

    /* 동적 배경 — JS에서 날씨에 따라 변경 */
    body.sunny   { background: linear-gradient(135deg, #f6d365, #fda085); }
    body.cloudy  { background: linear-gradient(135deg, #606c88, #3f4c6b); }
    body.rainy   { background: linear-gradient(135deg, #373b44, #4286f4); }
    body.snowy   { background: linear-gradient(135deg, #e6dada, #274046); }
    body.night   { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 56px;
      text-align: center;
      min-width: 340px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon { font-size: 80px; margin-bottom: 12px; }

    .temp {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .desc {
      font-size: 20px;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 8px;
      text-transform: capitalize;
    }

    .location {
      font-size: 14px;
      font-weight: 300;
      opacity: 0.6;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    .details {
      display: flex;
      gap: 32px;
      justify-content: center;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .detail-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.5;
    }

    .detail-value {
      font-size: 18px;
      font-weight: 600;
    }

    .loading {
      font-size: 18px;
      opacity: 0.7;
    }

    .loading::after {
      content: '';
      animation: dots 1.4s infinite;
    }

    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <p class="loading" id="loading">날씨 불러오는 중</p>
  </div>

  <script>
    const WMO_DESC = {
      0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림',
      45: '안개', 48: '짙은 안개',
      51: '이슬비', 53: '이슬비', 55: '이슬비',
      61: '비', 63: '비', 65: '폭우',
      71: '눈', 73: '눈', 75: '폭설',
      77: '싸락눈', 80: '소나기', 81: '소나기', 82: '강한 소나기',
      85: '눈보라', 86: '눈보라',
      95: '뇌우', 96: '뇌우(우박)', 99: '뇌우(우박)'
    };

    const WMO_ICON = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      71: '🌨️', 73: '🌨️', 75: '❄️',
      77: '🌨️', 80: '🌦️', 81: '🌧️', 82: '⛈️',
      85: '🌨️', 86: '❄️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };

    function bgClass(code, isDay) {
      if (!isDay) return 'night';
      if (code === 0 || code === 1) return 'sunny';
      if (code <= 3) return 'cloudy';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return 'rainy';
      if (code >= 71 && code <= 86) return 'snowy';
      return 'cloudy';
    }

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,is_day`
        + `&timezone=auto`;
      const res = await fetch(url);
      return res.json();
    }

    async function fetchCity(lat, lon) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`
        );
        const data = await res.json();
        const a = data.address;
        return a.city || a.town || a.village || a.county || a.state || '현재 위치';
      } catch {
        return `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
      }
    }

    function render(data, city) {
      const c = data.current;
      const code = c.weather_code;
      document.body.className = bgClass(code, c.is_day);

      document.getElementById('card').innerHTML = `
        <div class="icon">${WMO_ICON[code] || '🌡️'}</div>
        <div class="temp">${Math.round(c.temperature_2m)}°</div>
        <div class="desc">${WMO_DESC[code] || '알 수 없음'}</div>
        <div class="location">📍 ${city}</div>
        <div class="details">
          <div class="detail-item">
            <span class="detail-label">습도</span>
            <span class="detail-value">${c.relative_humidity_2m}%</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">바람</span>
            <span class="detail-value">${c.wind_speed_10m} km/h</span>
          </div>
        </div>
      `;
    }

    // 기본 좌표: 서울
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LON = 126.978;

    async function init() {
      try {
        const pos = await new Promise((resolve, reject) =>
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 })
        );
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
      } catch {
        var lat = DEFAULT_LAT;
        var lon = DEFAULT_LON;
      }

      const [weather, city] = await Promise.all([
        fetchWeather(lat, lon),
        fetchCity(lat, lon)
      ]);
      render(weather, city);
    }

    init();
  </script>
</body>
</html>
